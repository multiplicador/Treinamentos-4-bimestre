        }

        .container {
            background: #FFFFFF;

            padding: 40px;

        .header {
            text-align: center;
            margin-bottom: 30px;

            padding-bottom: 20px;
        }

        .header h1 {
            color: #231F20;

            margin-bottom: 8px;
        }

        .header p {
            color: #414042;
            font-size: 0.95em;
        }

        .search-box {
            margin-bottom: 25px;
        }

        .search-box label {
            display: block;
            font-weight: 600;
            color: #231F20;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .search-box label .required {
            color: #D03025;
        }

        .search-box input,
        .search-box select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #DCDDDE;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s;
            outline: none;
            background-color: #FFFFFF;
            color: #231F20;
        }

        .search-box input:focus,
        .search-box select:focus {
            border-color: #D03025;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #D03025, #7A1315);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(208, 48, 37, 0.4);
        }

        .results {
            margin-top: 30px;
        }

        .result-card {
            background: #f8f8f8;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 15px;
            border-left: 5px solid #D03025;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card .nome {
            font-size: 1.15em;
            font-weight: 700;
            color: #231F20;
            margin-bottom: 12px;
        }

        .result-card .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .result-card .info-label {
            font-weight: 600;
            color: #414042;
            font-size: 0.9em;
        }

        .result-card .info-value {
            color: #231F20;
            font-size: 0.9em;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .status-aprovado {
            background: #d4edda;
            color: #155724;
        }

        .status-reprovado {
            background: #f8d7da;
            color: #7A1315;
        }

        .status-pendencias {
            background: #fff3cd;
            color: #856404;
        }

        .status-recuperacao {
            background: #cce5ff;
            color: #004085;
        }

        .alerta-contato {
            border: 2px solid #ffc107;
            background: #fff3cd;
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 15px;
            animation: fadeIn 0.5s ease;
        }

        .alerta-contato .alerta-icon {
            font-size: 1.3em;
            margin-bottom: 6px;
        }

        .alerta-contato p {
            color: #856404;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .alerta-contato strong {
            color: #6d5200;
        }

        .alerta-reprovado {
            border: 2px solid #D03025;
            background: #fdf0ef;
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 15px;
            animation: fadeIn 0.5s ease;
        }

        .alerta-reprovado .alerta-icon {
            font-size: 1.3em;
            margin-bottom: 6px;
        }

        .alerta-reprovado p {
            color: #7A1315;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .alerta-reprovado strong {
            color: #7A1315;
        }

        .alerta-reprovado .politica {
            font-style: italic;
            margin-top: 8px;
            padding-left: 12px;
            border-left: 3px solid #D03025;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #414042;
            font-size: 1em;
        }

        .no-results .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .error-msg {
            text-align: center;
            padding: 20px;
            color: #D03025;
            font-weight: 600;
            font-size: 0.95em;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px solid #DCDDDE;
            color: #414042;
            font-size: 0.8em;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }
            .header h1 {
                font-size: 1.4em;
            }
            .result-card .info-row {
                flex-direction: column;
            }
        }
    </style>

            if (s.includes("recupera")) return "status-recuperacao";
            return "status-pendencias";

            if (s.includes("recupera")) return "&#128260;";
            return "&#10067;";
