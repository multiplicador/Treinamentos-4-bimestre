
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Status - Ademicon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#231F20,#414042,#231F20);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px}
.ct{background:#FFF;border-radius:20px;padding:40px;max-width:700px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.hd{text-align:center;margin-bottom:30px;border-bottom:3px solid #D03025;padding-bottom:20px}
.hd h1{color:#7A1315;font-size:1.8em;margin-bottom:8px}
.hd p{color:#414042;font-size:.95em}
.sb{margin-bottom:20px}
.sb label{display:block;font-weight:600;color:#231F20;margin-bottom:8px;font-size:.95em}
.rq{color:#D03025}
.dk{display:block;font-size:.8em;color:#414042;font-weight:400;margin-top:4px}
.sb input,.sb select{width:100%;padding:14px 18px;border:2px solid #DCDDDE;border-radius:12px;font-size:1em;outline:none;background:#FFF;color:#231F20;transition:border-color .3s}
.sb input:focus,.sb select:focus{border-color:#D03025}
.bt{width:100%;padding:14px;background:linear-gradient(135deg,#D03025,#7A1315);color:#FFF;border:none;border-radius:12px;font-size:1.05em;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:10px}
.bt:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(208,48,37,0.4)}
.rs{margin-top:30px}
.cd{background:#f8f8f8;border-radius:14px;padding:24px;margin-bottom:15px;border-left:5px solid #D03025;animation:fi .4s ease}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cd .nm{font-size:1.15em;font-weight:700;color:#7A1315;margin-bottom:12px}
.cd .ir{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.cd .il{font-weight:600;color:#414042;font-size:.9em}
.cd .iv{color:#231F20;font-size:.9em}
.bg{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:700;font-size:.85em;margin-top:8px}
.sa{background:#d4edda;color:#155724}
.sr{background:#f8d7da;color:#7A1315}
.sp{background:#fff3cd;color:#856404}
.sc{background:#cce5ff;color:#004085}
.ap{border:2px solid #ffc107;background:#fff3cd;border-radius:12px;padding:18px 22px;margin-top:15px;animation:fi .5s ease}
.ap p{color:#856404;font-size:.95em;line-height:1.5}
.ap strong{color:#6d5200}
.ar{border:2px solid #D03025;background:#fdf0ef;border-radius:12px;padding:18px 22px;margin-top:15px;animation:fi .5s ease}
.ar p{color:#7A1315;font-size:.95em;line-height:1.6}
.ar strong{color:#7A1315}
.ar .pl{font-style:italic;margin-top:8px;padding-left:12px;border-left:3px solid #D03025}
.nr{text-align:center;padding:30px;color:#414042;font-size:1em}
.nr .ic{font-size:3em;margin-bottom:10px}
.em{text-align:center;padding:20px;color:#D03025;font-weight:600;font-size:.95em}
.ft{text-align:center;margin-top:30px;padding-top:15px;border-top:2px solid #DCDDDE;color:#414042;font-size:.8em}
@media(max-width:500px){.ct{padding:25px 20px}.hd h1{font-size:1.4em}.cd .ir{flex-direction:column}}
</style>
</head>
<body>
<div class="ct">
  <div class="hd">
    <h1>&#128218; Consulta de Treinamento</h1>
    <p>Status do 4&ordm; Bimestre (Julho/Agosto 2026)</p>
  </div>
  <div class="sb">
    <label for="un">Selecione sua Unidade: <span class="rq">*</span></label>
    <select id="un">
      <option value="">-- Selecione a Unidade --</option>
    </select>
  </div>
  <div class="sb">
    <label for="nm">Seu Nome Completo: <span class="rq">*</span>
      <span class="dk">Digite seu nome completo, em letras MAIUSCULAS e sem acentos. Ex: MARIA JOSE DA SILVA</span>
    </label>
    <input type="text" id="nm" placeholder="EX: MARIA JOSE DA SILVA" autocomplete="off">
  </div>
  <button class="bt" onclick="buscar()">&#128269; Consultar Status</button>
  <div class="rs" id="rs"></div>
  <div class="ft"><p>Atualizado em: 30/09/2026 | 4&ordm; Bimestre</p></div>
</div>

<!-- DADOS: carrega o arquivo dados.js que deve estar na mesma pasta -->
<script src="dados.js"></script>

<script>
// Mapa de status: 0=Aprovado4bi, 1=Reprovado4bi, 2=Pendencias, 3=Aprovado3bi, 4=Recuperacao3bi
var SN=["Aprovado 4\u00ba bimestre","Reprovado 4\u00ba bimestre","Pend\u00eancias - 4\u00ba bimestre","Aprovado 3\u00ba Bi","Recupera\u00e7\u00e3o 3\u00ba BI"];

// Converte os dados compactos para objetos completos
var D=[];
DADOS.forEach(function(r){
  D.push({n:r.n, s:SN[r.s], u:r.u, d:r.d});
});

// Preenche a lista suspensa de unidades automaticamente
var unidades={};
D.forEach(function(r){unidades[r.u]=1});
var sel=document.getElementById("un");
Object.keys(unidades).sort().forEach(function(u){
  var o=document.createElement("option");
  o.value=u;
  o.textContent=u;
  sel.appendChild(o);
});

function norm(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}

function cls(s){
  var x=norm(s);
  if(x.indexOf("aprovado")>=0)return"sa";
  if(x.indexOf("reprovado")>=0)return"sr";
  if(x.indexOf("pendencia")>=0)return"sp";
  if(x.indexOf("recupera")>=0)return"sc";
  return"sp";
}

function emo(s){
  var x=norm(s);
  if(x.indexOf("aprovado")>=0)return"\u2705";
  if(x.indexOf("reprovado")>=0)return"\u274C";
  if(x.indexOf("pendencia")>=0)return"\u26A0\uFE0F";
  if(x.indexOf("recupera")>=0)return"\uD83D\uDD04";
  return"\u2753";
}

function buscar(){
  var ni=document.getElementById("nm").value.trim().toUpperCase();
  var ui=document.getElementById("un").value;
  var rv=document.getElementById("rs");

  if(!ni||!ui){
    rv.innerHTML='<div class="em">\u26A0\uFE0F Selecione sua <strong>Unidade</strong> e digite seu <strong>Nome Completo</strong>.</div>';
    return;
  }

  var nn=norm(ni);
  var R=D.filter(function(r){return norm(r.n)===nn && r.u===ui});

  if(R.length===0){
    rv.innerHTML='<div class="nr"><div class="ic">\uD83D\uDE15</div><p>Nenhum resultado encontrado.<br>Verifique se o <strong>nome completo</strong> e a <strong>unidade</strong> est\u00e3o corretos.<br><small>Lembre-se: digite sem acentos e em letras mai\u00fasculas.</small></p></div>';
    return;
  }

  var h="";var tP=false;var tR=false;

  R.forEach(function(r){
    var x=norm(r.s);
    if(x.indexOf("pendencia")>=0)tP=true;
    if(x.indexOf("reprovado")>=0)tR=true;
    h+='<div class="cd">';
    h+='<div class="nm">'+r.n+'</div>';
    h+='<div class="ir"><span class="il">Unidade:</span><span class="iv">'+r.u+'</span></div>';
    h+='<div class="ir"><span class="il">Bimestre:</span><span class="iv">4\u00ba bimestre (julho/agosto)</span></div>';
    h+='<div class="ir"><span class="il">Data de Realiza\u00e7\u00e3o:</span><span class="iv">'+r.d+'</span></div>';
    h+='<div class="ir"><span class="il">Status:</span><span class="iv"><span class="bg '+cls(r.s)+'">'+emo(r.s)+' '+r.s+'</span></span></div>';
    h+='</div>';
  });

  if(tR){
    h+='<div class="ar">';
    h+='<p>\u274C <strong>Reprovado por n\u00e3o atender aos crit\u00e9rios da nossa pol\u00edtica:</strong></p>';
    h+='<p class="pl">N\u00e3o ser\u00e3o aceitos treinamentos aplicados em dias de fechamento (dia 15 e o dia do fechamento do m\u00eas) nas Unidades.</p>';
    h+='</div>';
  }

  if(tP){
    h+='<div class="ap">';
    h+='<p>\u26A0\uFE0F <strong>Aten\u00e7\u00e3o:</strong> Voc\u00ea possui pend\u00eancias no 4\u00ba bimestre.</p>';
    h+='<p>Entre em contato com o <strong>Suporte Multiplicadores no formulário de solicitações</strong> para regularizar sua situa\u00e7\u00e3o.</p>';
    h+='</div>';
  }

  rv.innerHTML=h;
}

document.getElementById("nm").addEventListener("keypress",function(e){
  if(e.key==="Enter")buscar();
});
</script>
</body>
</html>
